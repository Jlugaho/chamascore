name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: chamascore_test
          POSTGRES_PASSWORD: chamascore_test
          POSTGRES_DB: chamascore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chamascore_test -d chamascore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://chamascore_test:chamascore_test@localhost:5432/chamascore_test
      TEST_DATABASE_URL: postgresql+psycopg2://chamascore_test:chamascore_test@localhost:5432/chamascore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m pytest tests -q --cov=app --cov-report=term-missing
        working-directory: backend
